name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The kanban package resolves its peer `@specstride/host-dsh` (this repo
      # itself) through node_modules; link the package to itself, as a
      # workspace/peer install would.
      - run: |
          mkdir -p packages/dsh-kanban/node_modules/@specstride
          ln -sfn ../../../../ packages/dsh-kanban/node_modules/@specstride/host-dsh
      - run: npm test
